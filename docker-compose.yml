services:

  # ─── MongoDB 7 Database Service ───────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: sintu_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sintu_network

  # ─── Backend API Service (Node.js 20 + Express + Prisma) ──────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sintu_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      DATABASE_URL: ${DATABASE_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sintu_network

  # ─── Frontend Web Service (React + Vite + Nginx) ──────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: sintu_frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - sintu_network
  
  # ─── Prometheus Monitoring ─────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sintu_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=3d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sintu_network
    depends_on:
      - node-exporter
    ports:
      - "127.0.0.1:9090:9090"

  # ─── EC2 Host Metrics ───────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sintu_node_exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - sintu_network


  # ─── Grafana Dashboards ─────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sintu_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - sintu_network
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"


# ─── Persistent Volumes ─────────────────────────────────────────────────────
volumes:
  mongo_data:
    name: sintu_mongo_data
  prometheus_data:
    name: sintu_prometheus_data

  grafana_data:
    name: sintu_grafana_data

# ─── Internal Bridge Network ────────────────────────────────────────────────
networks:
  sintu_network:
    name: sintu_internal_network
    driver: bridge
